<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="사진관 카메라">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="친구사랑 우정 사진관에서 아이패드를 카메라로 쓰는 페이지입니다.">
  <title>우정 사진관 카메라</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=1">
  <script type="module" src="app.js?v=1"></script>
</head>
<body data-state="setup">
  <main class="live" aria-label="카메라 화면">
    <video id="video" playsinline muted autoplay></video>
  </main>

  <!-- 사진관 도우미가 '카메라 페이지가 제자리에 떠 있다'고 알아보는 표시. 위치는 app.js가 정한다. -->
  <div class="marks" id="marks" aria-hidden="true"></div>

  <div class="band band-bottom">
    <p class="band-status" id="status" role="status"></p>
    <div class="band-actions">
      <button type="button" id="flip">앞 카메라로</button>
      <button type="button" id="full">전체 화면</button>
      <button type="button" id="stop">끄기</button>
    </div>
  </div>

  <div class="notice" id="notice" hidden>
    <p class="notice-title" id="notice-title"></p>
    <p class="notice-text" id="notice-text"></p>
    <button type="button" class="btn btn-primary" id="notice-action" hidden></button>
  </div>

  <section class="setup" id="setup" aria-labelledby="setup-title">
    <div class="sheet">
      <h1 id="setup-title">우정 사진관 카메라</h1>
      <p class="lead">이 아이패드를 친구사랑 우정 사진관의 카메라로 씁니다. 이 페이지는 영상을 어디에도 보내지 않고 맥이 케이블로 화면을 받아 갑니다.</p>
      <ol class="how">
        <li><span class="num">1</span><span><strong>가로로 세워요</strong>카메라가 친구들을 보도록 아이패드를 가로로 세워 둡니다.</span></li>
        <li><span class="num">2</span><span><strong>케이블로 이어요</strong>맥스튜디오에 연결합니다. 처음 연결하면 아이패드에서 '신뢰'를 누릅니다.</span></li>
        <li><span class="num">3</span><span><strong>카메라를 켜요</strong>아래 단추를 누르면 사진관 화면에 바로 보여요.</span></li>
      </ol>
      <div class="pick" role="radiogroup" aria-label="쓸 카메라">
        <button type="button" role="radio" aria-checked="true" data-facing="environment">뒤 카메라</button>
        <button type="button" role="radio" aria-checked="false" data-facing="user">앞 카메라</button>
      </div>
      <button type="button" class="btn btn-primary btn-xl" id="start">카메라 켜기</button>
      <p class="note" id="setup-note">알림이 사진관 화면에 비치지 않게 제어 센터에서 방해 금지 모드를 켜 두세요.</p>
    </div>
  </section>
</body>
</html>
